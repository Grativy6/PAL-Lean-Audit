name: APCI Lean audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enforce source and inventory policy
        run: ./scripts/policy_scan.sh

      - name: Build and independently type-check
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: true
          leanchecker: true
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Produce logical-dependency receipt
        id: receipt
        run: |
          mkdir -p audit
          lake env lean Audit.lean | tee audit/axioms.txt
          if grep -En '\bsorryAx\b' audit/axioms.txt; then
            echo 'incomplete-proof dependency present in receipt' >&2
            exit 1
          fi

      - name: Upload audit receipt
        if: ${{ always() && steps.receipt.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apci-lean-audit-receipt
          path: audit/axioms.txt
          if-no-files-found: error
