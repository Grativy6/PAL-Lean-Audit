name: PAL v2.3 and CHARTER bounded checks

on:
  pull_request:
    paths:
      - 'Experiments/**'
      - 'Experiments.lean'
      - 'Audit/pal-v23-charter/**'
      - 'scripts/run_pal23_charter.py'
      - 'scripts/extract_pal23_charter_sources.py'
      - 'scripts/check_policy.py'
      - 'docs/generated/pal-v23-charter-local-checks.md'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.gitattributes'
      - '.github/workflows/pal23-charter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up pinned Lean and build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: true
          leanchecker: false
          use-mathlib-cache: true
      - name: Verify preserved local evidence and parser guards
        run: |
          python3 Audit/pal-v23-charter/check_publication.py --check
          python3 Audit/pal-v23-charter/check_receipt_guards.py --output artifacts/pal23-charter-replay/receipt-guard-results.json
      - name: Replay all declared targets with exact dependency inventory
        env:
          PAL23_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAL23_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 Audit/pal-v23-charter/check_publication.py \
            --replay --lake lake --output-dir artifacts/pal23-charter-replay
      - name: Upload exact CI execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pal23-charter-declared-lean-replay
          if-no-files-found: error
          path: |
            artifacts/pal23-charter-replay/
            Audit/pal-v23-charter/publication-inputs.json
            Audit/pal-v23-charter/receipt-guard-results.json
