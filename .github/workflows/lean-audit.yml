name: FRONT Lean audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify historical source and receipt identity
        run: python scripts/ci_verify.py
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Replay build declarations axioms and all 13 kernel modules
        run: python scripts/ci_verify.py --replay
      - name: Preserve fresh replay receipt and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: front-kernel-replay
          path: .ci-evidence/
          if-no-files-found: ignore
