<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <rect width="1000" height="650" fill="white"/>
  <style>
    .title{font:700 30px sans-serif;fill:#183b66}.label{font:600 20px sans-serif;fill:#222}.note{font:17px sans-serif;fill:#444}.shell{fill:none;stroke-width:3;opacity:.75}.direct{fill:none;stroke:#d62728;stroke-width:8}.via{fill:none;stroke:#7b4ab5;stroke-width:8}.node{stroke:#222;stroke-width:2}.axis{stroke:#999;stroke-width:2;stroke-dasharray:7 7}
  </style>
  <text x="500" y="42" text-anchor="middle" class="title">Same endpoints, different prime-shell route</text>
  <line x1="500" y1="570" x2="500" y2="95" class="axis"/>
  <ellipse cx="500" cy="520" rx="155" ry="55" class="shell" stroke="#1f77b4"/>
  <ellipse cx="500" cy="335" rx="230" ry="78" class="shell" stroke="#e67e22"/>
  <ellipse cx="500" cy="135" rx="300" ry="98" class="shell" stroke="#2ca02c"/>
  <text x="815" y="145" class="label">p = 13</text><text x="745" y="345" class="label">p = 7</text><text x="665" y="530" class="label">p = 3</text>
  <circle cx="500" cy="520" r="13" fill="#1f77b4" class="node"/>
  <circle cx="610" cy="335" r="13" fill="#e67e22" class="node"/>
  <circle cx="430" cy="135" r="13" fill="#2ca02c" class="node"/>
  <path d="M500 520 L430 135" class="direct"/>
  <path d="M500 520 L610 335 L430 135" class="via"/>
  <line x1="90" y1="90" x2="150" y2="90" class="direct"/><text x="165" y="97" class="note">direct 3 → 13</text>
  <line x1="90" y1="125" x2="150" y2="125" class="via"/><text x="165" y="132" class="note">via 7: 3 → 7 → 13</text>
  <text x="500" y="620" text-anchor="middle" class="note">The routes share source and target and induce the same present flat transport, but retain different ordered histories.</text>
</svg>
